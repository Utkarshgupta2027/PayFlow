server.port=8080

# Keep local development self-contained with a file-backed H2 database.
spring.datasource.url=jdbc:h2:file:./data/paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

twilio.account-sid=
twilio.auth-token=
twilio.phone-number=

jwt.secret=${JWT_SECRET:local-dev-access-secret-change-before-deploy}
jwt.refresh-secret=${JWT_REFRESH_SECRET:local-dev-refresh-secret-change-before-deploy}

# Offline Payments local development configuration
offline.max-per-transaction=500.0
offline.max-escrow=2000.0
offline.certificate-validity-days=7
offline.signing.private-key=${OFFLINE_SIGNING_PRIVATE_KEY:}
offline.signing.public-key=${OFFLINE_SIGNING_PUBLIC_KEY:}

